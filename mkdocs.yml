site_name: Roler
site_description: Discord bot for easy and descriptive role management.
site_url: https://gh.seria.moe/roler
repo_url: https://github.com/seriaati/roler
repo_name: seria/roler
copyright: Copyright &copy; Seria

theme:
  theme:
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
      primary: indigo
      accent: indigo

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: indigo
      accent: indigo

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

docs_dir: docs

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Creating Panels: guide/creating-panels.md
      - Reusable Templates: guide/reusable-templates.md
  - Reference:
      - Button: reference/button.md
      - Separator: reference/separator.md
      - Image: reference/image.md
      - Gallery: reference/gallery.md
      - Section: reference/section.md
      - Webhook: reference/webhook.md
      - Template Tag: reference/template-tag.md
  - Validation Rules: validation.md
  - Self-Hosting: self-hosting.md

plugins:
  - search
  - social

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
